name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff) — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types (mypy + pyrefly) — debt, see DEBT.md
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # No bloqueante a proposito: el codigo heredado no esta anotado.
    # Cuando mypy strict llegue a 0, quitar continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: mypy
        run: uv run mypy .
      - name: pyrefly
        run: uv run pyrefly check

  test:
    name: Tests (pytest) — debt, see DEBT.md
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # No bloqueante: 5 fallos preexistentes del candidato v0.5.0-rc.1
    # mas contaminacion de git ambiente. Ver DEBT.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: Run tests outside the ambient git repo
        run: |
          mkdir -p "$RUNNER_TEMP/adk" && tar -c --exclude=.git . | tar -x -C "$RUNNER_TEMP/adk"
          cd "$RUNNER_TEMP/adk" && uv run --project "$GITHUB_WORKSPACE" pytest -q
