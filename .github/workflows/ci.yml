name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff) — blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types (mypy + pyrefly) — report only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # Report-only hasta que la deuda llegue a 0. Ver DEBT.md.
      - name: mypy
        run: |
          uv run mypy . > mypy.txt 2>&1 || true
          N=$(grep -c "error:" mypy.txt || true)
          tail -5 mypy.txt
          {
            echo "### mypy (Python ${{ matrix.python-version }})"
            echo "**$N errores.** Objetivo: 0 con \`strict = true\`. Ver \`DEBT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$N" -eq 0 ]; then exit 0; fi
      - name: pyrefly
        run: |
          uv run pyrefly check > pyrefly.txt 2>&1 || true
          N=$(grep -oE "[0-9]+ errors" pyrefly.txt | tail -1 || echo "?")
          tail -5 pyrefly.txt
          {
            echo "### pyrefly (Python ${{ matrix.python-version }})"
            echo "**$N.** Ver \`DEBT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typecheck-python-${{ matrix.python-version }}
          path: |
            mypy.txt
            pyrefly.txt
          retention-days: 7

  test:
    name: Tests (pytest) — report only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # Fuera del work tree para evitar la contaminacion de git ambiente.
      # Report-only por los 5 fallos preexistentes. Ver DEBT.md.
      - name: Run tests
        run: |
          mkdir -p "$RUNNER_TEMP/adk"
          tar -c --exclude=.git . | tar -x -C "$RUNNER_TEMP/adk"
          set +e
          ( cd "$RUNNER_TEMP/adk" && uv run --project "$GITHUB_WORKSPACE" pytest -q ) > pytest.txt 2>&1
          set -e
          tail -12 pytest.txt
          {
            echo "### pytest (Python ${{ matrix.python-version }})"
            echo '```'
            tail -3 pytest.txt
            echo '```'
            echo "Fallos preexistentes del candidato. Ver \`DEBT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: pytest.txt
          retention-days: 7
