[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-docs-kit"
version = "0.5.0rc1"
description = "Kit documental para agentes: bootstrap, historial append-only, hechos documentales y gate del indice Git"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["portalocker==4.4.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agent-docs-kit = "agent_docs_kit:main"
knowledge = "knowledge_cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["agent_docs_kit.py", "knowledge_cli.py", "discovery.py", "doc_current.py", "doc_evidence.py",
                "doc_impact.py", "doc_links.py", "doc_revisions.py", "facts.py", "git_gate.py",
                "history.py", "living_docs.py"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
