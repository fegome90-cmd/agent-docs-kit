[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-docs-kit"
version = "0.5.0rc1"
description = "Kit documental para agentes: bootstrap, historial append-only, hechos documentales y gate del indice Git"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["portalocker==4.4.2"]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyrefly>=0.30",
]

[project.scripts]
agent-docs-kit = "agent_docs_kit:main"
knowledge = "knowledge_cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["agent_docs_kit.py", "knowledge_cli.py", "discovery.py", "doc_current.py", "doc_evidence.py",
                "doc_impact.py", "doc_links.py", "doc_revisions.py", "facts.py", "git_gate.py",
                "history.py", "living_docs.py"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
show_column_numbers = true
show_error_context = true
namespace_packages = true
explicit_package_bases = true
cache_dir = ".mypy_cache"
exclude = ["^\\.venv$", "^\\.git$", "^build$", "^dist$", "^tests$", "^examples$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
